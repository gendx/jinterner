[package]
name = "jinterner"
description = "Efficient and concurrent interning of JSON data"
version = "0.7.0"
authors = ["Guillaume Endignoux <ggendx@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/gendx/jinterner"
categories = ["caching", "encoding", "memory-management", "concurrency"]
keywords = ["arena", "interning", "interner", "json"]
exclude = [".github/*"]
edition = "2024"
rust-version = "1.91.0"

[package.metadata.docs.rs]
features = ["debug", "delta", "get-size2", "retain", "serde", "std", "sync"]
rustdoc-args = ["--cfg", "docsrs", "--generate-link-to-definition"]

[features]
default = ["std", "sync"]
debug = ["get-size2", "blazinterner/debug"]
delta = ["blazinterner/delta", "dep:hashbrown"]
get-size2 = ["dep:get-size2", "blazinterner/get-size2"]
retain = ["blazinterner/retain"]
serde = ["dep:serde", "dep:serde_tuple", "blazinterner/serde", "hashbrown/serde", "ordered-float/serde"]
std = ["blazinterner/std", "serde_json/std"]
sync = ["blazinterner/sync"]

[dependencies]
get-size2 = { optional = true, version = "0.11.0", default-features = false, features = ["derive"] }
blazinterner = { version = "0.5.1", default-features = false, features = ["raw"] }
hashbrown = { optional = true, version = "0.17.1" }
ordered-float = { version = "5.3.0", default-features = false }
serde = { optional = true, version = "1.0.229", default-features = false, features = ["derive"] }
serde_json = { version = "1.0.151", default-features = false, features = ["alloc"] }
serde_tuple = { optional = true, version = "1.1.3", default-features = false }
