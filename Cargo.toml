[package]
name = "jinterner"
description = "Efficient and concurrent interning of JSON data"
version = "0.7.0"
authors = ["Guillaume Endignoux <ggendx@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/gendx/jinterner"
categories = ["caching", "encoding", "memory-management", "concurrency"]
keywords = ["arena", "interning", "interner", "json"]
exclude = [".github/*", "data/*"]
edition = "2024"
rust-version = "1.95.0"

[package.metadata.docs.rs]
features = ["base64", "debug", "delta", "get-size2", "hex", "postcard-schema", "retain", "serde", "std", "sync"]
rustdoc-args = ["--cfg", "docsrs", "--generate-link-to-definition"]

[features]
default = ["std", "sync"]
base64 = ["dep:base64"]
debug = ["get-size2", "blazinterner/debug"]
delta = ["blazinterner/delta", "dep:hashbrown"]
get-size2 = ["dep:get-size2", "blazinterner/get-size2"]
hex = ["dep:hex"]
postcard-schema = ["dep:postcard-schema", "blazinterner/postcard-schema"]
retain = ["blazinterner/retain"]
serde = ["dep:serde", "blazinterner/serde", "hashbrown/serde", "ordered-float/serde"]
std = ["blazinterner/std", "serde_json/std"]
sync = ["blazinterner/sync"]

[dependencies]
base64 = { optional = true, version = "0.23.1", default-features = false, features = ["alloc"] }
blazinterner = { version = "0.6.3", default-features = false, features = ["raw"] }
get-size2 = { optional = true, version = "0.11.1", default-features = false, features = ["derive"] }
hashbrown = { optional = true, version = "0.17.1" }
hex = { optional = true, version = "0.4.3", default-features = false, features = ["alloc"] }
ordered-float = { version = "5.5.1", default-features = false }
postcard-schema = { optional = true, version = "0.2.5", features = ["derive"] }
serde = { optional = true, version = "1.0.229", default-features = false, features = ["derive"] }
serde_json = { version = "1.0.154", default-features = false, features = ["alloc"] }

[dev-dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
criterion = "0.8.2"
postcard = { version = "1.1.3", features = ["use-std"] }
rstest = { version = "0.28.0", default-features = false }
simd-json = "0.19.0"

[[test]]
name = "integration"
required-features = ["serde", "std"]

[[bench]]
name = "criterion"
harness = false
required-features = ["serde", "std", "sync"]

[[example]]
name = "parse"
required-features = ["serde", "std", "sync"]
