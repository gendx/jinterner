[package]
name = "jinterner"
description = "Efficient and concurrent interning of JSON data"
version = "0.6.0"
authors = ["Guillaume Endignoux <ggendx@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/gendx/jinterner"
categories = ["caching", "encoding", "memory-management", "concurrency"]
keywords = ["arena", "interning", "interner", "json"]
exclude = [".github/*"]
edition = "2024"
rust-version = "1.91.0"

[package.metadata.docs.rs]
features = ["debug", "delta", "get-size2", "retain", "serde", "sync"]
rustdoc-args = ["--cfg", "docsrs", "--generate-link-to-definition"]

[features]
default = ["sync"]
debug = ["get-size2", "blazinterner/debug", "blazinterner/std"]
delta = ["blazinterner/delta"]
get-size2 = ["dep:get-size2", "blazinterner/get-size2"]
retain = ["blazinterner/retain"]
serde = ["dep:serde", "dep:serde_tuple", "blazinterner/serde"]
sync = ["blazinterner/sync"]

[dependencies]
get-size2 = { optional = true, version = "0.11.0", features = ["derive"] }
blazinterner = { version = "0.5.1", default-features = false, features = ["raw"] }
ordered-float = { version = "5.3.0", features = ["serde"] }
serde = { optional = true, version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_tuple = { optional = true, version = "1.1.3" }
