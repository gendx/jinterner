on: [push, pull_request]
name: Tests
jobs:
  test:
    strategy:
      matrix:
        rust:
          - stable
          - beta
          - nightly
          - 1.95.0  # MSRV
      fail-fast: false
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-D warnings -C debug_assertions"
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Run tests (default features)
        run: cargo test --release --verbose --all
      - name: Run tests (no default features)
        run: cargo test --release --verbose --all --no-default-features

      - name: Run tests (all features except sync)
        run: cargo test --release --verbose --all --no-default-features --features=base64,debug,delta,get-size2,hex,postcard-schema,retain,serde,std
      - name: Run tests (all features)
        run: cargo test --release --verbose --all --all-features
